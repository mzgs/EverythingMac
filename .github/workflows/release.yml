name: Release
run-name: Release ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Pushed commit to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Read version and reject an existing tag
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 -c 'import tomllib; print("v" + tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
          case "$status" in
            404) ;;
            200) echo "Tag $tag already exists; bump the version in Cargo.toml first." >&2; exit 1 ;;
            *) echo "GitHub tag check failed (HTTP $status)." >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check release script
        run: python3 tests/release_test.py
      - name: Build app bundle
        run: ./build.sh
      - name: Package app and checksum
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$ARCH"
          mkdir -p dist
          archive="EverythingMac-$TAG-macos-$ARCH.zip"
          ditto -c -k --sequesterRsrc --keepParent 'target/release/Everything Mac.app' "dist/$archive"
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and publish release
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          sha256sum -c ./*.sha256
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          payload=$(jq -n --arg tag "$TAG" --arg commit "$COMMIT" \
            '{tag_name: $tag, target_commitish: $commit, name: ("Everything Mac " + $tag),
              body: "macOS ARM64 and Intel x86_64 builds. Ad-hoc signed; not Developer ID signed or notarized.",
              generate_release_notes: true, draft: true}')
          release=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Content-Type: application/json' --data "$payload" "$api")
          id=$(printf '%s' "$release" | jq -er '.id')
          upload_url=$(printf '%s' "$release" | jq -er '.upload_url | split("{")[0]')
          for asset in ./*.zip ./*.sha256; do
            name=$(jq -rn --arg name "${asset##*/}" '$name | @uri')
            curl --fail --silent --show-error --output /dev/null \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$asset" "$upload_url?name=$name"
          done
          curl --fail --silent --show-error --output /dev/null --request PATCH \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Content-Type: application/json' --data '{"draft":false}' "$api/$id"
