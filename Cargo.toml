[package]
name = "eveythingmac"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dirs = "6"
fsevent-sys = "4"
libc = "0.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSApplication", "NSResponder", "NSWindow", "NSEvent"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSError", "NSString"] }
objc2-quick-look-ui = { version = "0.3.2", default-features = false, features = ["std", "QLPreviewPanel", "QLPreviewItem", "objc2-app-kit"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "dc00da1837f16a6da42280535d76a2d7acc4a40e", features = ["gpui-fast"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }

[dev-dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "dc00da1837f16a6da42280535d76a2d7acc4a40e", features = ["test-support"] }

[profile.dev]
debug = 0
incremental = false
